<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#121317">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sombek"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<title>Sombek</title>
<!--TG--><script src="https://telegram.org/js/telegram-web-app.js"></script><!--/TG-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Sombek: qora mavzu, och-ko'k aksent, pastda 5 bo'limli navigatsiya */
:root{color-scheme:dark;--bg:#121317;--surf:#1a1c22;--nav:#212831;--acc:#91c1fb;--accd:#2c4a70;--fab:#2f6fe4;--tx:#e8eaee;--mut:#8d929d;--red:#ff4d5e;--grn:#4fd17a;--bd:#30343d;--rd:12px;--trk:#2a2e36;--font:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);outline:0}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;max-width:520px;height:100%;margin:0 auto;overflow:hidden;background:var(--bg)}
#tabs{position:absolute;inset:0;display:flex;flex-direction:column}
.hd{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 8px 6px}
.hc{text-align:center}.bl{font-size:13px;color:var(--mut);display:inline-flex;gap:6px;align-items:center}.bl svg{width:15px;height:15px}
.bv{font-size:26px;font-weight:400;letter-spacing:-.3px;margin-top:1px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--tx);transition:.15s}.ib:active{background:#ffffff14}
#scr{flex:1;overflow-y:auto;padding:4px 14px calc(env(safe-area-inset-bottom,0px) + 100px);scrollbar-width:none}
#scr::-webkit-scrollbar{display:none}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--nav);padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:5}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:#c8ccd4}
.nav .pl{height:30px;width:56px;border-radius:16px;display:grid;place-items:center;transition:.25s}
.nav button.on{color:var(--acc);font-weight:500}.nav button.on .pl{background:var(--accd)}
.tb{display:flex;border-bottom:1px solid var(--bd);margin:0 -14px 14px}
.tb button{flex:1;padding:13px 0;font-size:14.5px;color:#c8ccd4;position:relative}
.tb button.on{color:var(--tx);font-weight:500}.tb button.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc);animation:grow .25s}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.sec{display:flex;justify-content:space-between;align-items:center;margin:6px 4px 10px;font-size:15px;font-weight:400}
.red{color:var(--red)}.grn{color:var(--grn)}.mut{color:var(--mut)}
.card{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--bd);border-radius:var(--rd);margin-bottom:10px;width:100%;text-align:left;animation:up .35s both}
.card .n{font-size:16px}.card .v{font-size:17px;margin-top:2px}
.tile{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;position:relative}
.tile .star{position:absolute;right:3px;bottom:3px;width:9px;height:9px;fill:var(--acc);stroke:none}
.add{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px dashed #3d424d;border-radius:var(--rd);margin-bottom:10px;width:100%;color:var(--mut);font-size:16px;text-align:left}
.add .tile{background:#23262d;color:#aab}
.pb{height:4px;border-radius:3px;background:#2a2e36;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;border-radius:3px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.mb{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:2px -6px 8px}
.ml{font-size:16px;padding:8px;display:inline-flex;gap:4px;align-items:center;justify-content:center}
.sum{display:flex;border:1px solid var(--bd);border-radius:var(--rd);margin-bottom:8px;font-size:12.5px;color:var(--mut);overflow:hidden}
.sum>div{flex:1;text-align:center;padding:7px 4px}.sum b{display:block;font-size:14px;font-weight:400;color:var(--tx);margin-top:1px}
.day{display:flex;align-items:center;gap:10px;padding:14px 4px 6px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.day .dn{font-size:28px;font-weight:300;min-width:34px}.day .dw{font-size:13px;line-height:1.25;color:#c8ccd4;flex:1}
.day .dt{font-size:16px}
.tx{display:flex;gap:12px;padding:9px 4px;align-items:flex-start;width:100%;text-align:left;animation:up .35s both}
.tx .b{flex:1;min-width:0}.tx .t{font-size:16px;line-height:1.25}
.chipa{display:inline-flex;align-items:center;gap:5px;font-size:14px;color:#dfe2e8;margin-top:3px}.chipa svg{width:19px;height:19px}
.tx .nt{font-size:13.5px;color:var(--mut);margin-top:3px;overflow-wrap:anywhere}
.tx .a{font-size:16px;white-space:nowrap;padding-top:2px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fab{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);height:56px;min-width:56px;border-radius:16px;background:var(--fab);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font-weight:500;box-shadow:0 6px 18px #0007;z-index:4;transition:.25s;overflow:hidden}
.fab span{max-width:90px;overflow:hidden;white-space:nowrap;transition:.25s}.fab.sm span{max-width:0}.fab.sm{padding:0 16px;gap:0}
.seg2{display:flex;background:#1b1e25;border-radius:var(--rd);padding:4px;gap:4px;margin-bottom:10px}
.seg2 button{flex:1;padding:9px 6px;border-radius:9px;font-size:14px;color:var(--mut);text-align:center;transition:.2s}
.seg2 button.on{background:var(--bg);color:var(--tx);box-shadow:0 0 0 1px #00000040}
.seg2 b{display:block;font-size:20px;font-weight:400;margin-top:2px;letter-spacing:-.3px}
.seg2.s button{padding:10px}
.box{border:1px solid var(--bd);border-radius:var(--rd);padding:12px;margin-bottom:10px;text-align:center}
.box h5{font-size:15px;font-weight:400;color:#dfe2e8}.box .big{font-size:22px;margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .box{margin:0}.two .tile{width:38px;height:38px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ct{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--bd);border-radius:var(--rd);text-align:left;min-width:0;animation:up .35s both}
.ct.z{opacity:.45}.ct .n{font-size:14px;line-height:1.2;overflow-wrap:anywhere}.ct .v{font-size:15px;margin-top:2px}.ct .tile{width:38px;height:38px}
.ct.add{margin:0;color:var(--mut);border-style:dashed;font-size:15px}
.chart{width:100%;display:block}
.cr{display:flex;align-items:center;gap:12px;padding:8px 0;width:100%;text-align:left}.cr>div:nth-child(2){flex:1;min-width:0}
.cr .l{display:flex;justify-content:space-between;font-size:15px;gap:8px}
.cr .p{font-size:13px;color:#c8ccd4;text-align:right;margin-top:3px}
.page{position:absolute;inset:0;background:var(--bg);overflow-y:auto;z-index:10;display:flex;flex-direction:column;animation:slide .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
.pgh{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 12px) 8px 10px;position:sticky;top:0;background:var(--bg);z-index:2;font-size:19px}
.pgh h2{flex:1;text-align:center;font-weight:400;font-size:19px;margin-right:44px}.pgh h2.r{margin-right:0}
.pb2{padding:6px 14px calc(env(safe-area-inset-bottom,0px) + 28px);flex:1}
.fld{border:1px solid var(--bd);border-radius:var(--rd);padding:14px;margin-bottom:12px;width:100%;display:block;text-align:left}
.fld>label,.fld>.lb{display:block;font-size:16px;margin-bottom:10px}
.fld .lk{color:var(--acc);font-size:14px;display:flex;gap:10px;align-items:center}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld textarea,.fld select,.fld input:not([type]){width:100%;background:transparent;border:1px solid #5a606c;border-radius:4px;padding:11px 12px;font-size:16px}
.fld input:focus,.fld textarea:focus{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.fld select{appearance:none;background:#1a1c22}
.fld input[type=month]{width:100%;background:transparent;border:1px solid #5a606c;border-radius:4px;padding:11px 12px;font-size:16px}
[data-skin=light] .fld input[type=month]{border-color:#d9dbe9;border-radius:12px}
.fld.rw{display:flex;justify-content:space-between;align-items:center;padding:0;overflow:hidden}.fld.rw .lb{padding:14px;margin:0}
.fld.rw .pv{width:78px;align-self:stretch;display:grid;place-items:center}
.amt{font-size:34px!important;font-weight:300;padding:8px 12px!important;border:0!important;border-bottom:1px solid #5a606c!important;border-radius:0!important;box-shadow:none!important}
.btn{display:block;width:100%;padding:15px;border-radius:30px;font-size:15.5px;font-weight:500;text-align:center;margin:10px 0 0;transition:.15s}.btn:active{transform:scale(.98)}
.bp{background:var(--acc);color:#0b1b2e}.bo{border:1px solid var(--bd);color:#dfe2e8}.bs{background:#2e3947;color:#dfe2e8}.bd{background:#a30a14;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 14px;border-radius:18px;border:1px solid var(--bd);font-size:14px;transition:.15s}.chip.on{background:var(--accd);border-color:var(--accd);color:#fff}
.tg{width:46px;height:26px;border-radius:14px;background:#3b4048;position:relative;transition:.2s;flex:none}.tg:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#bbb;transition:.2s}.tg.on{background:#2f6fe4}.tg.on:after{left:23px;background:#fff}
.menu{display:flex;align-items:center;gap:20px;padding:17px 6px;width:100%;text-align:left;font-size:15.5px;border-bottom:1px solid #1d2027}
.menu svg{color:#c8ccd4}.menu:active{background:#ffffff0d}
.bigt{font-size:30px;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 8px;display:flex;align-items:center;gap:10px;font-weight:400}
.picks{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.pk{aspect-ratio:1;border:1px solid #4a505b;border-radius:12px;display:grid;place-items:center;transition:.15s}.pk.on{background:#ffffff1c;border-color:#fff}
.hl2{display:flex;align-items:center;gap:12px;color:var(--tx);font-size:19px;margin:16px 0 12px}.hl2:before,.hl2:after{content:"";flex:1;height:1px;background:#3a3f48}
.cols{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}.cols i{width:34px;height:34px;border-radius:50%;border:3px solid transparent;transition:.15s;cursor:pointer}.cols i.on{border-color:#fff;transform:scale(1.1)}
#sh{position:absolute;inset:0;background:#0009;z-index:40;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.25s}
#sh.on{opacity:1;pointer-events:auto}
#sh .in{width:100%;max-height:85%;overflow-y:auto;background:#1e2128;border-radius:24px 24px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(50px);transition:.3s cubic-bezier(.2,.8,.2,1)}
#sh.on .in{transform:none}
.in h4{font-size:18px;font-weight:500;margin-bottom:14px}
.row{display:flex;align-items:center;gap:14px;padding:13px 4px;width:100%;text-align:left;font-size:16px}
.rad{width:20px;height:20px;border-radius:50%;border:2px solid #7d838f;flex:none;position:relative}.rad.on{border-color:var(--acc)}.rad.on:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--acc)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.acts button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:#cfd3da}.acts .tile{width:52px;height:52px;border-radius:12px}
.empty{text-align:center;color:var(--mut);padding:50px 20px;font-size:15px}
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);background:#e8eaee;color:#111;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mgrid button{padding:13px;border-radius:12px;background:#272b33;font-size:15px}.mgrid button.on{background:var(--accd);color:#fff}
textarea.ex{width:100%;height:150px;background:#1a1c22;border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:12px;resize:none}

/* ===== animatsiyalar (video) ===== */
#tabs,.nav,.fab{transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .45s,border-radius .45s;transform-origin:50% 0}
#app.modal #tabs,#app.modal .nav,#app.modal .fab{transform:scale(.93) translateY(14px);filter:brightness(.5);border-radius:22px}
#app.modal #tabs{overflow:hidden}
.page.mod{top:calc(env(safe-area-inset-top,0px) + 10px);border-radius:22px 22px 0 0;animation:mup .45s cubic-bezier(.2,.8,.2,1);overflow:hidden;box-shadow:0 -10px 40px #0008}
@keyframes mup{from{transform:translateY(100%)}to{transform:none}}
#scr.sl{animation:sl .35s cubic-bezier(.2,.8,.2,1)}#scr.sr{animation:sr .35s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}@keyframes sr{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.card .tile{box-shadow:0 8px 20px -10px currentColor}
button:not(.knob):active{transition:transform .1s}
.txf{flex:1;display:flex;flex-direction:column;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);min-height:0}
.amtbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:118px;padding:6px 16px}
.amtd{font-size:56px;font-weight:500;letter-spacing:-1.5px;white-space:nowrap;transition:color .3s,font-size .2s,transform .3s;font-variant-numeric:tabular-nums;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.amtd .ph{color:#3d424c}.amtd .op{color:#6b717c;font-weight:400;margin:0 2px}.amtd .cu{font-size:.42em;color:var(--mut);font-weight:400;margin-left:8px;letter-spacing:0}
.amtd .nw{display:inline-block;animation:dg .32s cubic-bezier(.2,.8,.2,1)}
@keyframes dg{from{opacity:0;transform:translateY(45%);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.amtd.go{color:var(--grn)}.amtd.col{animation:col .3s}
@keyframes col{0%{transform:scale(1)}40%{transform:scale(.86);filter:blur(4px);opacity:.4}100%{transform:none}}
.amtd.shake{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.res{height:28px;margin-top:4px;padding:4px 14px;border-radius:14px;font-size:15px;color:#c8ccd4;opacity:0;transform:translateY(-6px);transition:.25s;background:linear-gradient(90deg,#23262d 0%,#363b45 50%,#23262d 100%);background-size:200% 100%;animation:shim 1.4s linear infinite;cursor:pointer}
.res.on{opacity:1;transform:none}@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.avl{font-size:12.5px;color:var(--mut);margin-top:6px}
.pick{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}.pick::-webkit-scrollbar{display:none}
.pc{flex:none;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:22px;background:#1e2128;border:1px solid var(--bd);font-size:14px;white-space:nowrap}
.pc .tile{width:30px;height:30px;border-radius:15px}.pc .tile svg{width:17px;height:17px}
.note2{margin:0 14px 6px;padding:10px 14px;border-radius:12px;background:#1a1c22;border:1px solid var(--bd);font-size:14px}
.opsr{display:flex;justify-content:space-around;margin:2px 26px 4px}.opsr button{width:56px;height:36px;font-size:24px;color:#b4b9c2;border-radius:12px;transition:.12s}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 14px 10px}
.keys button{height:52px;border-radius:16px;background:#1c1f25;font-size:24px;font-weight:400;transition:background .15s,transform .12s;display:grid;place-items:center}
.keys button.pr,.opsr button.pr{background:#3a404b;transform:scale(.93)}
.swp{position:relative;margin:0 14px;height:58px;border-radius:30px;background:#1c1f25;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.swp .fill{position:absolute;left:0;top:0;bottom:0;width:58px;background:linear-gradient(90deg,#1a8f3a,#22e04a);border-radius:30px;opacity:.9}
.swp span{position:absolute;inset:0;display:grid;place-items:center;font-size:14.5px;padding-left:40px;background:linear-gradient(90deg,#6b717c 0%,#6b717c 40%,#fff 50%,#6b717c 60%,#6b717c 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.2s linear infinite}
.swp .knob{position:absolute;left:5px;top:5px;width:48px;height:48px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;box-shadow:0 4px 14px #0006;cursor:grab;touch-action:none}
#ok{position:absolute;inset:0;z-index:70;background:#22e04a;color:#052a10;display:grid;place-items:center;text-align:center;clip-path:circle(0 at 85% 90%);pointer-events:none;transition:clip-path .55s cubic-bezier(.6,0,.2,1)}
#ok.on{clip-path:circle(150% at 85% 90%);pointer-events:auto}
#ok svg{width:84px;height:84px;stroke:#052a10;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
#ok.on svg{animation:draw .5s .35s forwards}@keyframes draw{to{stroke-dashoffset:0}}
#ok b{display:block;font-size:44px;font-weight:500;letter-spacing:-1px;margin-top:8px;opacity:0;transform:translateY(12px)}
#ok p{opacity:0;margin-top:6px;font-size:15px}#ok small{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);font-size:13px;opacity:0}
#ok.on b,#ok.on p,#ok.on small{animation:okin .45s .5s forwards}#ok.on p{animation-delay:.6s}#ok.on small{animation-delay:.9s}
@keyframes okin{to{opacity:.85;transform:none}}#ok.on b{animation-name:okb}@keyframes okb{to{opacity:1;transform:none}}
/* ===== YORUG' DIZAYN (rasm): och-binafsha fon, oq kartalar, indigo aksent ===== */
:root[data-skin=light]{color-scheme:light;--bg:#f3f4fb;--surf:#fff;--nav:#fff;--acc:#5b5ef4;--accd:#ecebff;--fab:#5b5ef4;--tx:#1d2140;--mut:#8b90a7;--red:#e5485c;--grn:#18a864;--bd:#e7e8f2;--rd:18px;--trk:#eceef8;--sh:0 6px 22px rgba(60,64,140,.08);--navy:#1d2347;--font:"Plus Jakarta Sans",Roboto,system-ui,-apple-system,sans-serif}
[data-skin=light] .ib:active{background:#1d21400d}
[data-skin=light] .tb button{color:var(--mut)}
[data-skin=light] .card,[data-skin=light] .ct,[data-skin=light] .box,[data-skin=light] .sum,[data-skin=light] .fld{background:#fff;border-color:transparent;box-shadow:var(--sh)}
[data-skin=light] .card .n,[data-skin=light] .ct .n{font-weight:600}
[data-skin=light] .add,[data-skin=light] .ct.add{border-color:#cfd2e6;background:transparent;box-shadow:none}[data-skin=light] .add .tile{background:#eceef8;color:var(--mut)}
[data-skin=light] .pb{background:#eceef8}
[data-skin=light] .day .dw,[data-skin=light] .cr .p,[data-skin=light] .acts button{color:#6b7090}[data-skin=light] .chipa{color:#4a4f6a}

function rowSave(key,id){const v=$('#rwn').value.trim();if(!v){toast('Nomini kiriting');return}const L=PL()[key];if(id)L.find(x=>x.id===id).n=v;else L.push({id:uid(),n:v,a:0,t:null});save();closeSheet();rp()}
function pCush(){const c=cushion(),P=PL(),d=dist(),ca=P.cush?S.accounts.find(a=>a.id===P.cush&&!a.arch):null,cur=ca?bal(ca.id):0,tgt=c.ct,p=tgt?cur/tgt:0,rem=Math.max(0,tgt-cur),mo=d.yost>0?Math.ceil(rem/d.yost):null;
  if(ca&&tgt&&ca.goal!==Math.round(tgt)){ca.goal=Math.round(tgt);psave()}
  return`<div class="pnote"><b>Xavfsizlik yostiqchasi</b>Daromad kelishi to'xtab qolganda ham ma'lum bir muddat hayotiy muhim xarajatlarga yetadigan, alohida jamlab boriladigan mablag'lar.</div>
  <div class="pcard"><h6>Yostiqcha maqsadi<span class="chips" style="flex-wrap:nowrap">${[3,6,12].map(n=>`<button class="chip ${c.N===n?'on':''}" style="padding:5px 10px;font-size:12.5px" onclick="PL().months=${n};save();rp()">${n} oy</button>`).join('')}</span></h6>
  <div style="display:flex;gap:16px;align-items:center">${ringH(p,96,Math.round(p*100)+'%')}<div style="min-width:0"><div class="mut" style="font-size:12px">Kerakli summa (tejalganda, ${c.N} oy)</div><b style="font-size:18px">${money(tgt)}</b><div class="mut" style="font-size:12px;margin-top:6px">Yig'ilgan: <b style="color:var(--tx)">${money(cur)}</b></div>
  ${!tgt?`<div style="font-size:12px;margin-top:4px;color:var(--acc)">Pastdagi jadvalni to'ldiring</div>`:rem<=0?`<div class="grn" style="font-size:12.5px;margin-top:4px;font-weight:600">Yostiqcha to'ldi! Endi bu ulush Kapitalga</div>`:mo?`<div style="font-size:12px;margin-top:4px;color:var(--acc)">Oyiga ${fmt(d.yost)} (${P.pct.yost}%) ajratsangiz ~${mo} oyda to'ladi</div>`:''}</div></div>
  <button class="btn bs" style="margin-top:12px;padding:11px" onclick="cushPick()">${ca?'Hisob: '+esc(ca.name):'Yostiqcha hisobini tanlash'}</button></div>
  <div class="lsec" style="margin-top:6px">Oylik xarajatlar</div>${tblH('mon')}
  <div class="ptbl">${TR('Oylik jami','ma','mt')}${TR('Yillik (× 12)','m12a','m12t')}</div>
  <div class="mut" style="font-size:12px;margin:0 4px 6px">"Tejalganda" bo'sh qolsa, Summasi olinadi. Yillik xarajatlar keyingi bo'limda.</div>
  <button class="chip on" style="margin-top:4px" onclick="pTab='yr';rp()">Yillik xarajatlar ›</button>`}
function pYr(){const N=cushion().N;return`<div class="lsec">Yillik xarajatlar</div>${tblH('yr')}
  <div class="ptbl"><div class="ptr h"><span>Yakun</span><span>Summasi</span><span>Tejalganda</span></div>${TR('Yillik xarajatlar','ya','yt')}${TR('Oylik xarajatlar × 12','m12a','m12t')}${TR('Yillik umumiy xarajatlar summasi','ua','ut')}${TR(`Xavfsizlik yostiqchasi summasi (${N} oy)`,'ca','ct','k')}${TR('Yillik xarajatlar uchun oyiga ajratish','y12a','y12t')}</div>
  <div class="mut" style="font-size:12px;margin:0 4px">Yostiqcha muddatini "Xavfsizlik yostiqchasi" bo'limida tanlaysiz (3, 6 yoki 12 oy).</div>`}
function cushPick(){const sv=liveAccs().filter(a=>a.type==='sav');sheet(`<h4>Yostiqcha qaysi hisobda?</h4>${sv.map(a=>`<button class="row" onclick="PL().cush=${a.id};save();closeSheet();rp()">${tileH(a.icon,a.color,38)}<span style="flex:1">${esc(a.name)}</span><span class="mut">${money(bal(a.id))}</span></button>`).join('')}<button class="btn bp" onclick="cushNew()">+ "Xavfsizlik yostiqchasi" hisobini yaratish</button>`)}
function cushNew(){const o={id:uid(),name:'Xavfsizlik yostiqchasi',icon:'health',color:'#3b9bff',type:'sav',start:0,goal:Math.round(cushion().ct),incl:true,desc:''};S.accounts.push(o);PL().cush=o.id;save();closeSheet();rp();toast('Hisob yaratildi')}
function pFree(){const P=PL(),L=S.tx.filter(inM),inc=sumType('in',L),ex=sumType('out',L),jam=inc-ex,cap=liveAccs().filter(a=>a.type==='sav').reduce((s,a)=>s+bal(a.id),0),pas=P.passive.reduce((s,x)=>s+(+x.a||0),0);
  const c=cushion(),need=c.m.a||ex,needT=c.m.t||ex,pr=need?pas/need:0,prT=needT?pas/needT:0,capNeed=P.yld>0?need*12/(P.yld/100):0;
  const B=(t,v,col,dl,x)=>`<div class="fb" style="background:${tint(col)};color:${col};animation-delay:${dl}s;${x||''}">${t}<small>${v}</small></div>`,O=(s,dl)=>`<span class="fo" style="animation-delay:${dl}s">${s}</span>`;
  return`<div class="pcard"><h6>Boylik formulasi</h6><div class="fx">${B('Daromad',fmt(inc),'#18a864',0)}${O('−',.05)}${B('Xarajat',fmt(ex),'#e5485c',.1)}${O('=',.15)}${B('Jamlanma',fmt(jam),'#3b82f6',.2)}${O('×',.25)}${B('Pul oqimi',fmt(pas)+'/oy','#7c5cff',.3)}${O('=',.35)}<div class="fb" style="background:linear-gradient(135deg,#5b5ef4,#8f6cf7);color:#fff;animation-delay:.4s;min-width:150px">Boylik (kapital)<small>${fmt(cap)}</small></div></div>
  <div class="mut" style="font-size:12px;margin-top:10px;text-align:center">Shu oy daromad va xarajatingiz, pul oqimi — passiv daromad, kapital — jamg'arma hisoblaringiz</div></div>
  <div class="pcard"><div class="stage"><span class="sn">5</span><div><b style="font-size:15px">5-bosqich: Moliyaviy erkinlik</b><div class="mut" style="font-size:13px;margin-top:3px;line-height:1.45">Alomati: passiv daromad barcha ko'ngil tusagan oylik xarajatlarni qoplaydi.</div></div></div>
  <div style="display:flex;gap:16px;align-items:center;margin-top:14px">${ringH(pr,104,Math.round(pr*100)+'%')}<div style="min-width:0"><div class="mut" style="font-size:12px">Passiv daromad / oylik xarajat</div><b style="font-size:15px">${fmt(pas)} / ${fmt(need)}</b>${pr>=1?`<div class="grn" style="font-size:13px;margin-top:6px;font-weight:600">🎉 Moliyaviy erkinlikka erishdingiz!</div>`:`<div style="font-size:12.5px;margin-top:6px">Yana <b>${money(need-pas)}</b> passiv daromad kerak</div>`}</div></div>
  <div class="prow" style="margin-top:10px;border:0;padding-bottom:4px"><span>Majburiy (tejalganda) xarajatlar qoplanishi</span><b>${Math.round(prT*100)}%</b></div><div class="pb" style="height:6px"><i style="width:${Math.min(100,prT*100)}%;background:var(--grn)"></i></div>
  ${!c.m.a?`<div class="mut" style="font-size:12px;margin-top:10px">Oylik xarajatlar jadvali bo'sh, shu oyning haqiqiy xarajati olindi. Aniqroq bo'lishi uchun "Xavfsizlik yostiqchasi" jadvalini to'ldiring.</div>`:''}</div>
  <div class="pcard"><h6>Passiv daromad manbalari<button class="chip on" style="padding:5px 11px;font-size:12.5px" onclick="pasForm()">+ Qo'shish</button></h6>${P.passive.length?P.passive.map(x=>`<button class="prow" style="width:100%;text-align:left" onclick="pasForm(${x.id})"><i class="dot" style="background:#7c5cff"></i><span>${esc(x.n)}</span><b>${fmt(x.a)}</b><em>/oy</em></button>`).join('')+`<div class="prow"><span><b>Jami</b></span><b>${money(pas)}</b><em>/oy</em></div>`:`<div class="mut" style="font-size:13px">Masalan: ijara daromadi, depozit foizi, dividend, biznesdagi ulush foydasi</div>`}</div>
  <div class="pcard"><h6>Erkinlik uchun kerakli kapital</h6><b style="font-size:20px">${money(capNeed)}</b><div class="mut" style="font-size:12.5px;margin-top:6px;line-height:1.5">Oylik ${fmt(need)} xarajatni yiliga <button style="color:var(--acc);font-weight:700" onclick="yldSheet()">${P.yld}% ✎</button> daromad keltiradigan kapital qoplaydi. Hozirgi kapital: ${fmt(cap)} (${capNeed?Math.round(cap/capNeed*100):0}%).</div><div class="pb" style="height:6px;margin-top:10px"><i style="width:${capNeed?Math.min(100,cap/capNeed*100):0}%;background:linear-gradient(90deg,#5b5ef4,#8f6cf7)"></i></div></div>
  <div class="pnote" style="border-color:#e0b83a;background:#e0b83a1f"><b style="color:#c99a1a">Daromad turlari</b><div><b style="display:inline;color:var(--tx);font-size:13.5px">Aktiv daromad</b> — ma'lum bir ishni doimiy bajarish ortidan keladigan pul.</div><div style="margin-top:6px"><b style="display:inline;color:var(--tx);font-size:13.5px">Passiv daromad</b> — doimiy bajaradigan ishingizga aloqasi bo'lmagan, ishlamasangiz ham baribir keladigan pul.</div></div>`}
function pasForm(id){const x=id?PL().passive.find(z=>z.id===id):null;sheet(`<h4>${x?'Manbani tahrirlash':'Passiv daromad manbai'}</h4><div class="fld" style="padding:10px"><input type="text" id="psn" value="${esc(x?x.n:'')}" placeholder="Masalan: Ijara daromadi"></div><div class="fld" style="padding:10px"><input type="text" id="psa" inputmode="numeric" value="${x&&x.a?fmt(x.a):''}" placeholder="Oylik summa" oninput="numIn(this)"></div><button class="btn bp" onclick="pasSave(${id||0})">Saqlash</button>${x?`<button class="btn bd" onclick="PL().passive=PL().passive.filter(z=>z.id!==${id});save();closeSheet();rp()">O'chirish</button>`:''}`)}
function pasSave(id){const n=$('#psn').value.trim(),a=+$('#psa').value.replace(/\D/g,'');if(!n||!a){toast('Nomi va summasini kiriting');return}const L=PL().passive;if(id)Object.assign(L.find(z=>z.id===id),{n,a});else L.push({id:uid(),n,a});save();closeSheet();rp()}
function yldSheet(){sheet(`<h4>Yillik daromadlilik (taxminiy)</h4><div class="fld" style="padding:10px;display:flex;gap:8px;align-items:center"><input type="number" id="yli" value="${PL().yld}" min="1" max="100"><b>%</b></div><div class="mut" style="font-size:12.5px;margin-bottom:6px">Kapitalingiz yiliga necha foiz daromad keltiradi deb hisoblaysiz</div><button class="btn bp" onclick="const v=+document.getElementById('yli').value;if(v>0&&v<=100){PL().yld=v;save();closeSheet();rp()}">Saqlash</button>`)}

<circle cx="180" cy="118" r="98" fill="#dcd9ff" opacity=".55"/><circle cx="292" cy="40" r="5" fill="#ffc857"/><circle cx="62" cy="170" r="4" fill="#ff8fab"/>
<g filter="url(#ds)"><rect x="128" y="22" width="104" height="190" rx="20" fill="#1d2347"/><rect x="136" y="34" width="88" height="170" rx="13" fill="#fff"/></g>
<circle cx="180" cy="80" r="22" fill="none" stroke="#eceef8" stroke-width="7"/><circle cx="180" cy="80" r="22" fill="none" stroke="#5b5ef4" stroke-width="7" stroke-linecap="round" stroke-dasharray="100 138" transform="rotate(-90 180 80)"/>
<text x="180" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#1d2140">72%</text>
<rect x="148" y="116" width="64" height="7" rx="3.5" fill="#eceef8"/><rect x="148" y="130" width="44" height="7" rx="3.5" fill="#eceef8"/>
<rect x="150" y="172" width="9" height="18" rx="3" fill="#c9c8ff"/><rect x="164" y="160" width="9" height="30" rx="3" fill="#9d9bff"/><rect x="178" y="150" width="9" height="40" rx="3" fill="#5b5ef4"/><rect x="192" y="164" width="9" height="26" rx="3" fill="#9d9bff"/>
<g class="flt" filter="url(#ds)"><rect x="34" y="62" width="96" height="58" rx="14" fill="#fff"/><circle cx="56" cy="91" r="12" fill="#e3f6ec"/><path d="M56 85v12M51 92l5 5 5-5" stroke="#18a864" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="74" y="82" width="44" height="6" rx="3" fill="#1d2140" opacity=".8"/><rect x="74" y="94" width="30" height="5" rx="2.5" fill="#c3c7d9"/></g>
<g class="flt2" filter="url(#ds)"><rect x="236" y="74" width="92" height="66" rx="14" fill="#fff"/><path d="M248 124l14-14 12 8 20-22 14 10" fill="none" stroke="#5b5ef4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="308" cy="106" r="4" fill="#fff" stroke="#5b5ef4" stroke-width="2"/></g>
<g class="flt"><rect x="246" y="156" width="28" height="28" rx="9" fill="#5b5ef4"/><path d="M253 170l5 5 9-10" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="flt2"><ellipse cx="88" cy="196" rx="20" ry="7" fill="#f0a91e"/><rect x="68" y="182" width="40" height="14" fill="#ffc857"/><ellipse cx="88" cy="182" rx="20" ry="7" fill="#ffd77a"/><text x="88" y="186" text-anchor="middle" font-size="9" font-weight="800" fill="#b07400">$</text></g></svg>`;
function welcome(){if(S.welcomed)return;const w=document.createElement('div');w.id='wel';w.innerHTML=`<div class="wt"><div class="lg4">${ic('apps')}</div><h1>Pulingiz,<br><em>nazoratda</em><br>bir joyda</h1><p>Kirim-chiqimni yozing, maqsad qo'ying va pul qayerga ketayotganini ko'ring.</p></div><div class="ill">${ILL}</div><div class="wb"><button class="go" onclick="welDone('light')">Boshlash ${ic('right')}</button><button class="alt" onclick="welDone('dark')">Qorong'i dizayn kerakmi? <b>Shu bilan boshlash</b></button></div>`;$('#app').appendChild(w)}
function welDone(s){S.welcomed=1;setSkin(s);const w=$('#wel');w.classList.add('out');setTimeout(()=>w.remove(),520)}
/* ===== boot ===== */
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js')}catch(e){}
$('#app').addEventListener('scroll',e=>{if(e.target.scrollTop)e.target.scrollTop=0});
applySkin();if(LT()&&tab==='accs')tab='home';runSched();R();welcome();
</script>
